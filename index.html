    <!-- ❗ 썸네일 이미지 절대경로 -->

    <!-- 기존 CSS -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/slick.css" />
    <link rel="stylesheet" href="css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"
    />

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 날짜 serif -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- 기본 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Save the Date -->
    <link
      href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- JQ -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* 페이지 페이드 효과 */
      body {
        opacity: 1;
        transition: opacity 1s ease;
      }

      body.fade-out {
        opacity: 0;
      }

      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;

        background: #efefef;

        font-family: "Gowun Dodum", sans-serif;
        /* color: #111; */
      }

      /* 전체 */
      .intro {
        width: 100%;
        height: 100vh;
        max-width: 620px;
        margin: 0 auto;

        display: flex;
        justify-content: center;
        align-items: center;
        background: #fdd1e4;

        /* padding: 30px; */
      }

      /* 내부 */
      .wrap {
        width: 100%;
        max-width: 430px;

        display: flex;
        flex-direction: column;
        align-items: center;

        text-align: center;
      }

      /* SVG */
      .svg-area {
        width: 100%;
        margin-bottom: 20px;
      }

      .save-svg {
        width: 100%;
        overflow: visible;
        transform: scale(0.8);
      }

      /* 공통 */
      .save-svg text {
        fill: transparent;

        /* 수정 */
        stroke: #664966;

        /* 얇은 두께 */
        stroke-width: 0.45;

        stroke-linecap: round;
        stroke-linejoin: round;

        font-family: "Corinthia", cursive;
        font-weight: 700;

        text-anchor: middle;

        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;

        animation: handwriting 2s ease forwards;
      }

      /* Save */
      .save {
        font-size: 210px;

        animation-delay: 0s;
      }

      /* the */
      .the {
        font-size: 80px;

        animation-delay: 1s;
      }

      /* Date */
      .date-script {
        font-size: 220px;

        animation-delay: 1.8s;
      }

      /* 손글씨 */
      /* 손글씨 */
      @keyframes handwriting {
        0% {
          stroke-dashoffset: 1400;
          fill: transparent;
        }

        70% {
          fill: transparent;
        }

        100% {
          stroke-dashoffset: 0;

          /* 수정 */
          fill: #664966;
        }
      }
      .wrap .title {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      /* 서브 */
      .sub {
        font-size: 18px;
        letter-spacing: 6px;
        /* margin-bottom: 62px; */

        opacity: 0;
        transform: translateY(20px);

        animation: fadeUp 1s ease forwards;
        animation-delay: 1.8s;
      }

      /* 날짜 */
      .date {
        display: flex;
        align-items: center;
        gap: 35px;

        margin: 0 0 32px;
        color: #664966;

        opacity: 0;
        transform: translateY(20px);

        animation: fadeUp 1s ease forwards;
        animation-delay: 2.1s;
      }

      .date span {
        font-family: "Cormorant Garamond", serif;
        font-size: 92px;
        font-weight: 300;
        line-height: 1;
      }

      /* 위치 */
      .location {
        font-size: 22px;
        letter-spacing: 2px;

        opacity: 0;
        transform: translateY(20px);

        animation: fadeUp 1s ease forwards;
        animation-delay: 2.7s;
      }

      /* 하단 */
      .confirm {
        font-size: 16px;
        letter-spacing: 1px;
        opacity: 0;
        transform: translateY(20px);
        margin-bottom: 16px;

        animation: fadeUp 1s ease forwards;
        animation-delay: 2.4s;
      }

      .jj_logo {
        position: absolute;
        bottom: 2%;
        left: 50%;
        transform: translateX(-50%);
        width: 14%;
      }

      /* 등장 */
      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 모바일 */
      @media (max-width: 720px) {
        .save {
          font-size: 44vw;
        }

        .the {
          font-size: 20vw;
          transform: translateY(3%);
        }

        .date-script {
          font-size: 46vw;
        }
        .svg-area {
          margin: -30vw 0 0 0;
        }
        .wrap .title {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }
        .sub {
          font-size: 5vw;
          /* margin-bottom: 12vw; */
          margin-top: 0;
        }
        .date {
          gap: 20px;
          /* margin-bottom: 11vw; */
          margin: 3vw 0 5vw;
        }

        .date span {
          font-size: 18vw;
        }
        .name-box {
          padding: 18px 20px;
          margin-bottom: 2.5vw;
          font-size: 7vw;
        }
        .location {
          font-size: 5vw;
          /* margin-bottom: 4%; */
        }
        .confirm {
          font-size: 4vw;
        }

        .jj_logo {
          position: absolute;
          bottom: 5%;
          left: 50%;
          transform: translateX(-50%);
          width: 14%;
        }
      }
    </style>
  </head>

  <body>
    <section class="intro">
      <div class="wrap">
        <!-- SVG -->
        <div class="svg-area">
          <svg class="save-svg" viewBox="0 0 500 380">
            <!-- SAVE -->
            <text class="save" x="240" y="120">Save</text>

            <!-- THE -->
            <text class="the" x="240" y="190">the</text>

            <!-- DATE -->
            <text class="date-script" x="230" y="330">Date</text>
          </svg>
        </div>

        <div class="title">
          <p class="sub">WEDDING DAY</p>

          <div class="date">
            <span>26.</span><span>06.</span><span>27</span>
          </div>

          <p class="confirm">2026년 6월 27일 토요일, 오후 12시 10분</p>

          <p class="location">더뉴컨벤션, 2층 더뉴홀</p>
        </div>

        <img src="img/jj_logo.png" alt="" class="jj_logo" />
      </div>
    </section>

    <script>
      // SVG 글자 길이 자동 계산
      $(".save-svg text").each(function () {
        const length = this.getComputedTextLength();

        $(this).css({
          "stroke-dasharray": length + 500,
          "stroke-dashoffset": length + 500,
        });
      });

      // 4.2초 뒤 자연스럽게 사라진 후 이동
      setTimeout(() => {
        document.body.classList.add("fade-out");

        // 페이드 끝난 뒤 이동
        setTimeout(() => {
          window.location.href = "jbjs_wedding.html";
        }, 1000);
      }, 4200);
    </script>
  </body>
</html>
